name: publish

# The owner creates the tag. Nothing is published from a branch, an untagged commit or a commit whose CI did not
# pass on main.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  actions: read # read the CI run of the tagged commit

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # REQUIRED REVIEWERS LIVE ON THE ENVIRONMENT. A tag is a release decision; a tag pushed by a stale branch must
    # not publish before a person approves the environment.
    environment: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out the SDK client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ninsei-Labs/sdk
          ref: 20515404f5546680ba609b71074d977bd2444196 # pinned; bump with the SDK release
          path: sdk-client

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Version must match the tag
        run: |
          set -eu
          pkg=$(bun -p 'require("./package.json").version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json says $pkg, the tag says $tag" >&2
            exit 1
          fi

      - name: Name the image labels
        id: labels
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse HEAD)"
          date="$(git show -s --format=%cI HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"

      # A VERSION IS PUBLISHED ONLY FROM A COMMIT ON MAIN WHOSE CHECK PASSED. The check run is read for the exact
      # tagged commit; a queued or running run is read again for at most 20 minutes, then anything but success
      # refuses before the image is built.
      - name: The commit is on main and its CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$sha" FETCH_HEAD; then
            echo "$GITHUB_REF_NAME is not on main" >&2
            exit 1
          fi
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$sha&event=push&branch=main"
          deadline=$((SECONDS + 1200))
          while :; do
            state=$(gh api "$runs" --jq '.workflow_runs[0] | .conclusion // .status // "missing"')
            case $state in
              queued | waiting | pending | requested | in_progress) ;;
              *) break ;;
            esac
            [ $((SECONDS + 30)) -le "$deadline" ] || break
            echo "CI for $sha is $state; reading it again in 30 s"
            sleep 30
          done
          if [ "$state" != success ]; then
            echo "CI has not passed for $sha ($state)" >&2
            exit 1
          fi

      - name: Run the witness checks
        run: bun run check

      - name: Run the SDK/witness interop check
        env:
          SDK_DIR: ${{ github.workspace }}/sdk-client
        run: bun run check:interop

      - name: Build the image for the smoke
        run: |
          docker build --pull \
            --build-arg VERSION="${{ steps.labels.outputs.version }}" \
            --build-arg BUILD_COMMIT="${{ steps.labels.outputs.commit }}" \
            --build-arg BUILD_DATE="${{ steps.labels.outputs.date }}" \
            -t witness-node:ci .

      - name: The image labels name this service
        env:
          VERSION: ${{ steps.labels.outputs.version }}
          COMMIT: ${{ steps.labels.outputs.commit }}
          DATE: ${{ steps.labels.outputs.date }}
        run: |
          set -eu
          label() { docker image inspect witness-node:ci --format "{{ index .Config.Labels \"$1\" }}"; }
          test "$(label org.opencontainers.image.version)" = "$VERSION"
          test "$(label org.opencontainers.image.revision)" = "$COMMIT"
          test "$(label org.opencontainers.image.created)" = "$DATE"
          test "$(label org.opencontainers.image.url)" = "https://github.com/Ninsei-Labs/witness-node"
          test "$(label org.opencontainers.image.title)" = "witness-node"

      - name: Run the container smoke
        run: bun run check:container

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # PROVENANCE AND SBOM travel with the tag. The smoke above ran the same Dockerfile, but the published image is
      # built by BuildKit so its attestations are attached to the digest an operator pulls.
      - name: Push the tagged image with provenance
        env:
          IMAGE: ghcr.io/ninsei-labs/witness-node
        run: |
          set -eu
          docker buildx create --use --name witness-publish >/dev/null 2>&1 || docker buildx use witness-publish
          docker buildx build --pull --push --provenance=true --sbom=true \
            --build-arg VERSION="${{ steps.labels.outputs.version }}" \
            --build-arg BUILD_COMMIT="${{ steps.labels.outputs.commit }}" \
            --build-arg BUILD_DATE="${{ steps.labels.outputs.date }}" \
            --tag "$IMAGE:${GITHUB_REF_NAME}" .

      # A PRE-RELEASE NEVER MOVES latest. Only a tag without a pre-release suffix is a release.
      - name: Move latest only for a release tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          IMAGE: ghcr.io/ninsei-labs/witness-node
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:${GITHUB_REF_NAME}"