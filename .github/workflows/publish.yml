name: publish

# The owner creates the tag. Nothing is published from a branch.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Run the witness checks
        run: bun run check
      - name: Build
        env:
          IMAGE: ghcr.io/ninsei-labs/witness-node
        run: |
          docker build --pull -t witness-node:ci -t "$IMAGE:${GITHUB_REF_NAME}" -t "$IMAGE:latest" .
      - name: Run the container smoke
        run: bun run check:container
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push
        env:
          IMAGE: ghcr.io/ninsei-labs/witness-node
        run: |
          docker push "$IMAGE:${GITHUB_REF_NAME}"
          docker push "$IMAGE:latest"
