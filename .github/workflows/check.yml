name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A draft PR does not start CI. The owner marks it ready after review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the SDK client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ninsei-Labs/sdk
          ref: main
          path: sdk-client
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Run the witness checks
        run: bun run check
      - name: Run the SDK/witness interop check
        env:
          SDK_DIR: ${{ github.workspace }}/sdk-client
        run: bun run check:interop
      - name: Build the image
        run: docker build --pull -t witness-node:ci .
      - name: Run the container smoke
        run: bun run check:container
