# EXAMPLE ONLY. Copy next to the service and fill in witness.env.
#
# The witness has no volumes and no writable paths. The host publishes it on loopback; a TLS reverse proxy is the
# public surface. This file starts one local instance. For several instances, copy it and change the names and
# ports.
services:
  witness:
    # Pin the release tag. The build block is for a local image; never deploy `latest`.
    image: ghcr.io/ninsei-labs/witness-node:v0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: witness-node
    env_file:
      - ./witness.env
    environment:
      RFQ_WITNESS_HOST: 0.0.0.0
      RFQ_WITNESS_PORT: "8796"
    ports:
      - "127.0.0.1:8796:8796"
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    restart: unless-stopped
